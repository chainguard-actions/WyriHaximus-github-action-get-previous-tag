name: Continuous Integration
on:
  push:
    branches:
      - 'master'
  pull_request:
permissions:
  contents: read
jobs:
  get-previous-tag:
    name: Test Get Previous Tag on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
      - name: 'Get Previous tag'
        id: previoustag
        uses: ./
      - env:
          TAG: ${{ steps.previoustag.outputs.tag }}
          TIMESTAMP: ${{ steps.previoustag.outputs.timestamp }}
        run: |
          echo "Tag: ${TAG}"
          echo "Timestamp: ${TIMESTAMP}"
          test -n "${TAG}"
          test -n "${TIMESTAMP}"
      - name: Remove tags
        uses: JesseTG/rm@549cc6e4afa499d481ea7b9c361eb7427840c78d # v1.0.2
        with:
          path: .git/refs/tags
      - name: 'Get Previous tag with fallback'
        id: previoustagwithfallback
        uses: ./
        with:
          fallback: v1.0.0
      - env:
          TAG: ${{ steps.previoustagwithfallback.outputs.tag }}
          TIMESTAMP: ${{ steps.previoustagwithfallback.outputs.timestamp }}
        run: |
          echo "Tag: ${TAG}"
          echo "Timestamp: ${TIMESTAMP}"
          test -n "${TAG}"
          test -n "${TIMESTAMP}"
