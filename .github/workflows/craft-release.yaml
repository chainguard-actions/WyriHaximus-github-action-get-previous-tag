name: Create Release
env:
  DOCKER_IMAGE: wyrihaximusgithubactions/jwage-changelog-generator
  MILESTONE: ${{ github.event.milestone.title }}
on:
  milestone:
    types:
      - closed
permissions:
  contents: write
  pull-requests: read
jobs:
  wait-for-status-checks:
    name: Wait for status checks
    runs-on: ubuntu-latest
    steps:
      - run: sleep 13
      - name: 'Wait for status checks'
        id: waitforstatuschecks
        uses: "WyriHaximus/github-action-wait-for-status@2dbd0a00b318c2898b5182fb418d80a9a9158937" # master
        with:
          ignoreActions: "Wait for status checks"
          checkInterval: 5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - if: steps.waitforstatuschecks.outputs.status != 'success'
        name: Fail
        run: exit 1
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs:
      - wait-for-status-checks
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Generate changelog
        uses: WyriHaximus/github-action-jwage-changelog-generator@b97c36534179756df70aae7f465135adecdc730b # master
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          milestone: ${{ env.MILESTONE }}
      - name: Show changelog
        run: echo "${CHANGELOG}"
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
  create-release:
    name: Create Release
    needs:
      - generate-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0 # Required due to the way Git works, without it this action won't be able to find any or the correct tags
      - name: Create release branch
        env:
          MILESTONE_VALUE: ${{ env.MILESTONE }}
        run: git checkout -b "release/${MILESTONE_VALUE}" "${GITHUB_SHA}"
      - env:
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
          MILESTONE_VALUE: ${{ env.MILESTONE }}
        run: echo -e "${CHANGELOG}" > "release-${MILESTONE_VALUE}-changelog.md"
      - env:
          MILESTONE_DESCRIPTION: ${{ github.event.milestone.description }}
          CHANGELOG: ${{ needs.generate-changelog.outputs.changelog }}
          MILESTONE_VALUE: ${{ env.MILESTONE }}
        run: |
          echo -e "${MILESTONE_DESCRIPTION}\r\n\r\n${CHANGELOG}" > "release-${MILESTONE_VALUE}-release-message.md"
          cat "release-${MILESTONE_VALUE}-release-message.md"
          release_message=$(cat "release-${MILESTONE_VALUE}-release-message.md")
          release_message="${release_message//'%'/'%25'}"
          release_message="${release_message//$'\n'/'%0A'}"
          release_message="${release_message//$'\r'/'%0D'}"
          echo "::set-output name=release_message::$release_message"
        id: releasemessage
      - name: Create release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.MILESTONE }}
          release_name: ${{ env.MILESTONE }}
          body: ${{ steps.releasemessage.outputs.release_message }}
          draft: false
          prerelease: false
      - name: Updated related tags
        uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1
        with:
          tag: ${{ env.MILESTONE }}
