name: Test basic usage - get previous tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a git tag for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.0.1
      - id: action
        uses: .
      - name: Assert tag output is set
        env:
          ACTUAL: ${{ steps.action.outputs.tag }}
        run: |
          echo "actual tag: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected tag output to be non-empty"
            exit 1
          fi
          echo "PASS: tag output is '$ACTUAL'"
      - name: Assert timestamp output is set
        env:
          ACTUAL: ${{ steps.action.outputs.timestamp }}
        run: |
          echo "actual timestamp: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected timestamp output to be non-empty"
            exit 1
          fi
          echo "PASS: timestamp output is '$ACTUAL'"
