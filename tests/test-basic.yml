name: Test basic tag retrieval
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a known test tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a lightweight tag with a known name that sorts latest by creatordate
          git tag v99.99.99-act-test
          echo "Created tag v99.99.99-act-test"

      - id: get-tag
        uses: .

      - name: Assert tag output is set
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          echo "actual tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: tag output is empty"
            exit 1
          fi
          echo "PASS: tag output is non-empty: $TAG"

      - name: Assert tag matches the created tag
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          echo "actual tag: $TAG"
          if [ "$TAG" != "v99.99.99-act-test" ]; then
            echo "FAIL: expected 'v99.99.99-act-test' but got '$TAG'"
            exit 1
          fi
          echo "PASS: tag matches expected value"

      - name: Assert timestamp output is set
        env:
          TIMESTAMP: ${{ steps.get-tag.outputs.timestamp }}
        run: |
          echo "actual timestamp: $TIMESTAMP"
          if [ -z "$TIMESTAMP" ]; then
            echo "FAIL: timestamp output is empty"
            exit 1
          fi
          # Timestamp should be a unix epoch integer
          if ! echo "$TIMESTAMP" | grep -qE '^[0-9]+$'; then
            echo "FAIL: timestamp is not a valid unix epoch integer: $TIMESTAMP"
            exit 1
          fi
          echo "PASS: timestamp is a valid unix epoch: $TIMESTAMP"
