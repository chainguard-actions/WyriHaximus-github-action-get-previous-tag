name: Test pattern input for tag filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create test tags
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v1.0.0
          git tag r1
      - id: action
        uses: .
        with:
          pattern: "v*[0-9].*[0-9].*[0-9]"
      - name: Assert tag output matches semver pattern
        env:
          ACTUAL: ${{ steps.action.outputs.tag }}
        run: |
          echo "actual tag: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a semver tag but got empty output"
            exit 1
          fi
          if [[ "$ACTUAL" != v* ]]; then
            echo "FAIL: expected tag starting with 'v' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: semver pattern matched tag '$ACTUAL'"
