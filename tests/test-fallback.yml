name: Test fallback tag when no tag matches pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure no semver tags exist
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Delete any existing semver-like tags so the pattern won't match
          git tag -l 'v*[0-9].*[0-9].*[0-9]' | xargs -r git tag -d

      - id: action
        uses: .
        with:
          pattern: "v*[0-9].*[0-9].*[0-9]"
          fallback: "v0.0.0"

      - name: Assert fallback tag is returned
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: expected tag output to be non-empty"
            exit 1
          fi
          if [ "$TAG" != "v0.0.0" ]; then
            echo "FAIL: expected fallback tag 'v0.0.0' but got '$TAG'"
            exit 1
          fi
          echo "PASS: fallback tag=$TAG"
