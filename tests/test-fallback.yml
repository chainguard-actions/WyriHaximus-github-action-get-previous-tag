name: Test fallback tag when no tags exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Remove all existing tags
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -l | xargs -r git tag -d

      - id: action
        uses: .
        with:
          fallback: v0.0.0

      - name: Assert fallback tag output
        env:
          ACTUAL_TAG: ${{ steps.action.outputs.tag }}
          ACTUAL_TS: ${{ steps.action.outputs.timestamp }}
        run: |
          echo "actual tag: $ACTUAL_TAG"
          echo "actual timestamp: $ACTUAL_TS"
          if [ "$ACTUAL_TAG" != "v0.0.0" ]; then
            echo "FAIL: expected fallback tag 'v0.0.0' but got '$ACTUAL_TAG'"
            exit 1
          fi
          if [ -z "$ACTUAL_TS" ]; then
            echo "FAIL: expected a non-empty timestamp"
            exit 1
          fi
          echo "PASS"
