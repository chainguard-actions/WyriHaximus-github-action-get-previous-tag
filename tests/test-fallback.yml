name: Test fallback input - no previous tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Remove any existing tags so fallback is used
        run: |
          git tag -d $(git tag -l) 2>/dev/null || true
      - id: action
        uses: .
        with:
          fallback: v0.0.0
      - name: Assert tag output equals fallback value
        env:
          ACTUAL: ${{ steps.action.outputs.tag }}
        run: |
          echo "actual tag: $ACTUAL"
          if [ "$ACTUAL" != "v0.0.0" ]; then
            echo "FAIL: expected tag output to be 'v0.0.0' (fallback), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: tag output is fallback value '$ACTUAL'"
