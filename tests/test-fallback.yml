name: Test fallback tag when no tags exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Remove all existing tags so fallback is triggered
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Delete all local tags so the action falls back to the provided fallback input
          git tag -l | xargs -r git tag -d
          echo "All local tags removed"
          git tag -l

      - id: get-tag
        uses: .
        with:
          fallback: v0.0.0-fallback

      - name: Assert tag output equals fallback
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          echo "actual tag: $TAG"
          if [ "$TAG" != "v0.0.0-fallback" ]; then
            echo "FAIL: expected fallback 'v0.0.0-fallback' but got '$TAG'"
            exit 1
          fi
          echo "PASS: tag output matches fallback value"

      - name: Assert timestamp output is set (fallback path uses current time)
        env:
          TIMESTAMP: ${{ steps.get-tag.outputs.timestamp }}
        run: |
          echo "actual timestamp: $TIMESTAMP"
          if [ -z "$TIMESTAMP" ]; then
            echo "FAIL: timestamp output is empty"
            exit 1
          fi
          # Timestamp should be a unix epoch integer
          if ! echo "$TIMESTAMP" | grep -qE '^[0-9]+$'; then
            echo "FAIL: timestamp is not a valid unix epoch integer: $TIMESTAMP"
            exit 1
          fi
          echo "PASS: timestamp is a valid unix epoch: $TIMESTAMP"
